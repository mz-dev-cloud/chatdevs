<!DOCTYPE html>
<html lang="pt-br" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Nova senha · ChatDevs</title>
  <link rel="icon" type="image/svg+xml" href="/img/logo.svg">
  <script>
    (function () {
      var tema = 'dark';
      try { tema = (JSON.parse(localStorage.getItem('config') || '{}').tema) || 'dark'; } catch (e) {}
      document.documentElement.setAttribute('data-theme', tema);
    })();
  </script>
  <style>
    :root {
      --bg: #101216;
      --card: #181b21;
      --borda: #2a2f38;
      --texto: #eef0f3;
      --suave: #98a1b0;
      --campo: #0f1114;
      --acento: #f5a623;
      --acento-texto: #1a1204;
      --erro: #ff6b6b;
      --ok: #4cd08a;
      --sombra: 0 20px 50px rgba(0, 0, 0, .45);
    }
    :root[data-theme="light"] {
      --bg: #f2f4f8;
      --card: #ffffff;
      --borda: #dde2ea;
      --texto: #1b2230;
      --suave: #667085;
      --campo: #f7f8fb;
      --acento: #e08e0b;
      --acento-texto: #ffffff;
      --erro: #d92d20;
      --ok: #16915a;
      --sombra: 0 20px 50px rgba(30, 40, 60, .12);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--texto);
      font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      padding-top: max(24px, env(safe-area-inset-top));
      padding-bottom: max(24px, env(safe-area-inset-bottom));
    }

    .painel {
      width: 100%;
      max-width: 400px;
      background: var(--card);
      border: 1px solid var(--borda);
      border-radius: 18px;
      padding: 36px 28px 30px;
      box-shadow: var(--sombra);
      text-align: center;
    }
    .logo { width: 52px; height: 52px; margin-bottom: 14px; }
    h1 { font-size: 22px; margin: 0 0 8px; font-weight: 700; letter-spacing: -.01em; }
    .sub { color: var(--suave); font-size: 14px; line-height: 1.55; margin: 0 0 24px; }

    .estado { display: none; }
    .estado.ativo { display: block; }

    .grupo { position: relative; margin-bottom: 12px; text-align: left; }
    .campo {
      width: 100%;
      background: var(--campo);
      border: 1px solid var(--borda);
      color: var(--texto);
      border-radius: 10px;
      padding: 13px 44px 13px 14px;
      font-size: 15px;
      font-family: inherit;
      outline: none;
      transition: border-color .15s;
    }
    .campo:focus { border-color: var(--acento); }
    .olho {
      position: absolute;
      right: 6px; top: 50%;
      transform: translateY(-50%);
      background: none; border: 0;
      color: var(--suave);
      width: 36px; height: 36px;
      border-radius: 8px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .olho:hover { color: var(--texto); }
    .olho svg { width: 20px; height: 20px; }

    .forca { height: 4px; background: var(--borda); border-radius: 4px; margin: 2px 0 8px; overflow: hidden; }
    .forca > i { display: block; height: 100%; width: 0; background: var(--erro); transition: width .2s, background .2s; }
    .dica { font-size: 12.5px; color: var(--suave); text-align: left; margin: 0 0 14px; min-height: 18px; }

    .erro { color: var(--erro); font-size: 13.5px; text-align: left; min-height: 20px; margin: 4px 0 10px; }

    .btn {
      width: 100%;
      background: var(--acento);
      color: var(--acento-texto);
      border: 0;
      border-radius: 10px;
      padding: 14px;
      font-size: 15px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: filter .15s, transform .05s;
    }
    .btn:hover { filter: brightness(1.07); }
    .btn:active { transform: translateY(1px); }
    .btn:disabled { opacity: .6; cursor: default; }
    .btn-fantasma {
      background: transparent;
      color: var(--texto);
      border: 1px solid var(--borda);
    }

    .icone-estado {
      width: 60px; height: 60px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 16px;
    }
    .icone-estado svg { width: 30px; height: 30px; }
    .icone-ok { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
    .icone-erro { background: color-mix(in srgb, var(--erro) 18%, transparent); color: var(--erro); }
    .contagem { color: var(--suave); font-size: 13px; margin: 14px 0 0; }
    .acoes { display: grid; gap: 10px; }
  </style>
</head>
<body>
  <main class="painel">
    <img src="/img/logo.svg" alt="ChatDevs" class="logo">

    <!-- Formulário -->
    <section id="estado-form" class="estado">
      <h1>Criar nova senha</h1>
      <p class="sub">Escolha uma senha que você não usa em outros lugares.</p>

      <form id="form" novalidate>
        <div class="grupo">
          <input id="senha" class="campo" type="password" placeholder="Nova senha" autocomplete="new-password">
          <button type="button" class="olho" data-alvo="senha" aria-label="Mostrar senha">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <div class="forca"><i id="forca"></i></div>
        <p class="dica" id="dica">Mínimo de 6 caracteres.</p>

        <div class="grupo">
          <input id="confirmar" class="campo" type="password" placeholder="Confirmar nova senha" autocomplete="new-password">
          <button type="button" class="olho" data-alvo="confirmar" aria-label="Mostrar senha">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>

        <p class="erro" id="erro" role="alert"></p>
        <button class="btn" id="btn-salvar" type="submit">Salvar nova senha</button>
      </form>
    </section>

    <!-- Sucesso -->
    <section id="estado-ok" class="estado">
      <div class="icone-estado icone-ok">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <h1>Senha alterada</h1>
      <p class="sub">Tudo certo. Agora é só entrar com a nova senha.</p>
      <div class="acoes">
        <button class="btn" id="btn-login" type="button">Ir para o login</button>
      </div>
      <p class="contagem" id="contagem"></p>
    </section>

    <!-- Link inválido -->
    <section id="estado-invalido" class="estado">
      <div class="icone-estado icone-erro">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </div>
      <h1>Link inválido ou expirado</h1>
      <p class="sub">Esse link já foi usado ou passou do prazo. Volte ao login, toque em <b>Esqueceu a senha?</b> e peça um novo.</p>
      <div class="acoes">
        <button class="btn" id="btn-voltar" type="button">Voltar ao login</button>
      </div>
    </section>
  </main>

  <script>
    (function () {
      var params = new URLSearchParams(location.hash.replace(/^#/, ''));
      var token = params.get('access_token');
      var tipo = params.get('type');
      var comErro = params.get('error') || params.get('error_code');
      // tira o token da barra de endereço
      try { history.replaceState(null, '', location.pathname); } catch (e) {}

      function mostrar(id) {
        document.querySelectorAll('.estado').forEach(function (e) { e.classList.remove('ativo'); });
        document.getElementById(id).classList.add('ativo');
      }
      function irParaLogin() { location.href = '/'; }

      document.getElementById('btn-voltar').onclick = irParaLogin;
      document.getElementById('btn-login').onclick = irParaLogin;

      if (!token || tipo !== 'recovery' || comErro) { mostrar('estado-invalido'); return; }
      mostrar('estado-form');

      var senha = document.getElementById('senha');
      var confirmar = document.getElementById('confirmar');
      var erroEl = document.getElementById('erro');
      var forca = document.getElementById('forca');
      var dica = document.getElementById('dica');

      // mostrar/ocultar senha
      document.querySelectorAll('.olho').forEach(function (b) {
        b.onclick = function () {
          var campo = document.getElementById(b.dataset.alvo);
          campo.type = campo.type === 'password' ? 'text' : 'password';
        };
      });

      // medidor de força
      senha.addEventListener('input', function () {
        var v = senha.value, pts = 0;
        if (v.length >= 6) pts++;
        if (v.length >= 10) pts++;
        if (/[A-Z]/.test(v) && /[a-z]/.test(v)) pts++;
        if (/\d/.test(v) && /[^A-Za-z0-9]/.test(v)) pts++;
        var largura = v.length ? Math.max(pts, 1) * 25 : 0;
        forca.style.width = largura + '%';
        forca.style.background = pts <= 1 ? 'var(--erro)' : pts <= 2 ? 'var(--acento)' : 'var(--ok)';
        dica.textContent = !v.length ? 'Mínimo de 6 caracteres.'
          : v.length < 6 ? 'Muito curta, faltam ' + (6 - v.length) + ' caractere(s).'
          : pts <= 1 ? 'Senha fraca. Misture letras, números e símbolos.'
          : pts <= 2 ? 'Boa. Dá pra deixar mais forte.'
          : 'Senha forte.';
      });

      document.getElementById('form').addEventListener('submit', async function (e) {
        e.preventDefault();
        erroEl.textContent = '';
        if (senha.value.length < 6) { erroEl.textContent = 'A senha precisa ter pelo menos 6 caracteres.'; return; }
        if (senha.value !== confirmar.value) { erroEl.textContent = 'As senhas não coincidem.'; return; }

        var btn = document.getElementById('btn-salvar');
        btn.disabled = true; btn.textContent = 'Salvando...';
        try {
          var resp = await fetch('/api/reset-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ accessToken: token, novaSenha: senha.value })
          });
          var data = await resp.json();
          if (!resp.ok) {
            if (resp.status === 401) { mostrar('estado-invalido'); return; }
            erroEl.textContent = data.error || 'Não foi possível salvar. Tente de novo.';
            btn.disabled = false; btn.textContent = 'Salvar nova senha';
            return;
          }
          // desloga desse navegador pra cair direto na tela de login
          try { localStorage.removeItem('usuario'); } catch (e2) {}
          mostrar('estado-ok');
          var seg = 5, c = document.getElementById('contagem');
          (function tick() {
            if (seg <= 0) { irParaLogin(); return; }
            c.textContent = 'Redirecionando em ' + seg + 's...';
            seg--; setTimeout(tick, 1000);
          })();
        } catch (err) {
          erroEl.textContent = 'Erro de conexão. Tente de novo.';
          btn.disabled = false; btn.textContent = 'Salvar nova senha';
        }
      });
    })();
  </script>
</body>
</html>
